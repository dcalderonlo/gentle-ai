name: Linux direct entry NNP diagnostic

on:
  push:
    branches: ['verification/linux-nnp-*']
    paths:
      - '.github/workflows/linux-direct-nnp-diagnostic.yml'
      - 'e2e/fixtures/direct-nnp-diagnostic.go.txt'

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.repository == 'dcalderonlo/gentle-ai' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        role: [before-linux-bootstrap, candidate]
    steps:
      - name: Checkout diagnostic definition
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          path: definition
          persist-credentials: false
      - name: Checkout immutable source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ matrix.role == 'before-linux-bootstrap' && 'ef04e2e2c94b51c6ee3fa4b7c68455910b86cd8f' || github.sha }}
          path: source
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Prepare disposable diagnostic test
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          git -C source rev-parse HEAD
          go version
          go env CGO_ENABLED
          target=source/internal/shellinstaller/zz_direct_nnp_diagnostic_linux_amd64_test.go
          test ! -e "$target"
          cp definition/e2e/fixtures/direct-nnp-diagnostic.go.txt "$target"
          gofmt -w "$target"
      - name: Execute one isolated privilege-context diagnostic
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          # A failure is retained as diagnostic RED, never converted into approval.
          go test -v ./internal/shellinstaller -run '^TestDirectNNPThreadDiagnostic$' -count=1 -timeout=30s
