name: Verified supervisor acquisition

on:
  workflow_dispatch:
    inputs:
      confirm_matrix:
        description: Explicitly authorize this diagnostic matrix and its runner cost
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  acquisition:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_matrix == true
    name: Signed acquisition (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout exact selected candidate
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Require acquisition test inventory
        shell: bash
        run: |
          set -euo pipefail
          tests=$(go test ./internal/update/upgrade -list '^TestAcquireReleaseBinary')
          printf '%s\n' "$tests"
          grep -q '^TestAcquireReleaseBinary$' <<< "$tests"
      - name: Verify signed acquisition with isolated fixtures
        run: go test ./internal/update/upgrade -run '^TestAcquireReleaseBinary' -count=1 -timeout=5m
      - name: Verify updater regression suite
        run: go test ./internal/update/upgrade -count=1 -timeout=5m
      - name: Check Go formatting
        run: go run ./internal/gofmtcheck
      - name: Compile installer and application tests natively
        run: go test ./internal/shellinstaller ./internal/cli ./internal/app ./internal/tui/... -run '^$' -count=1 -timeout=5m
      - name: Require integration test inventory
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/shellinstaller -list '^(TestStageUserSupervisor|TestSupervisorRelease|TestUserSupervisor|TestUserHomebrew)' | tee "$RUNNER_TEMP/supervisor-tests.txt"
          grep -q '^TestSupervisorReleaseContextPreservesCancellationAndVersion$' "$RUNNER_TEMP/supervisor-tests.txt"
          if [ "$RUNNER_OS" != Windows ]; then
            grep -q '^TestSupervisorReleaseStaging$' "$RUNNER_TEMP/supervisor-tests.txt"
            grep -q '^TestStageUserSupervisorPreservesExistingDestination$' "$RUNNER_TEMP/supervisor-tests.txt"
            grep -q '^TestUserHomebrewHintNamesPrivateRemediationForHomebrewAncestors$' "$RUNNER_TEMP/supervisor-tests.txt"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            grep -q '^TestUserSupervisorPreimages$' "$RUNNER_TEMP/supervisor-tests.txt"
          fi
          go test ./internal/cli -list '^TestShellInstallRelease' | tee "$RUNNER_TEMP/cli-tests.txt"
          grep -q '^TestShellInstallReleaseInlinePreservesCallerContext$' "$RUNNER_TEMP/cli-tests.txt"
          go test ./internal/app -list '^TestShellInstallInitializesBuildBeforeEarlyDispatch$' | tee "$RUNNER_TEMP/app-tests.txt"
          grep -q '^TestShellInstallInitializesBuildBeforeEarlyDispatch$' "$RUNNER_TEMP/app-tests.txt"
      - name: Execute supervisor staging and existing provenance regressions
        run: go test -v ./internal/shellinstaller -run '^(TestStageUserSupervisor|TestSupervisorRelease|TestUserSupervisor|TestUserHomebrew)' -count=1 -timeout=5m
      - name: Execute CLI context and embedded entry tests
        run: go test -v ./internal/cli -run '^TestShellInstallRelease' -count=1 -timeout=5m
      - name: Execute early application dispatch tests
        run: go test -v ./internal/app -run '^TestShellInstallInitializesBuildBeforeEarlyDispatch$' -count=1 -timeout=5m
